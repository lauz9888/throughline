name: CI

# Pipeline step 15: install deps + build, typecheck, lint, format check, unit tests,
# BDD tests, dependency audit, e2e tests, Storybook tests, combined coverage gate.
# Runs on every push/PR so the ship-feature workflow can watch it via `gh pr checks --watch`.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  bdd-tests:
    name: BDD tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:bdd

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  e2e-tests:
    name: E2E tests (local build/preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      # No BASE_URL set: playwright.config.ts's webServer block builds and
      # previews the app locally (port 4173) instead of hitting a live
      # deployment. `pretest:e2e` (package.json) installs the Chromium
      # browser automatically before this runs.

  storybook-tests:
    name: Storybook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:storybook
      # `pretest:storybook` (package.json) installs the Chromium browser
      # automatically before `test:storybook` runs. `build-storybook` is a
      # build-health gate only; its output is not shared with other jobs.

  coverage-merge:
    name: Combined coverage (statements >=90%, branches >=90%, see .waypoint/config.json)
    runs-on: ubuntu-latest
    env:
      # Mirror the thresholds in .waypoint/config.json's `coverage` — update
      # both places together if either ever changes.
      COVERAGE_THRESHOLD: 90
      BRANCH_COVERAGE_THRESHOLD: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scripts/merge-coverage.mjs invokes `npx playwright test` directly
      # (not via `npm run test:e2e`), which bypasses the `pretest:e2e` npm
      # lifecycle hook — the browser must be installed explicitly here. The
      # same install also serves the Storybook leg (the script calls
      # `npx vitest` directly, bypassing `pretest:storybook`).
      - run: npm run browsers:install
      - name: Run combined coverage and enforce thresholds
        # test:coverage:merge exits non-zero on any validity failure (pipefail
        # carries that through tee); investigation signals are printed as
        # "Coverage signal:" lines and never fail the job.
        run: |
          set -o pipefail
          npm run test:coverage:merge | tee coverage-output.txt
          stmt=$(grep -oE '^Combined coverage: [0-9.]+' coverage-output.txt | grep -oE '[0-9.]+')
          branch=$(grep -oE '^Combined branch coverage: [0-9.]+' coverage-output.txt | grep -oE '[0-9.]+')
          if [ -z "$stmt" ] || [ -z "$branch" ]; then
            echo "Could not parse combined statement/branch coverage from test:coverage:merge output"
            exit 1
          fi
          echo "Combined statement coverage: ${stmt}% (threshold: ${COVERAGE_THRESHOLD}%)"
          echo "Combined branch coverage: ${branch}% (threshold: ${BRANCH_COVERAGE_THRESHOLD}%)"
          awk -v pct="$stmt" -v threshold="$COVERAGE_THRESHOLD" \
            'BEGIN { exit (pct+0 < threshold+0) ? 1 : 0 }'
          awk -v pct="$branch" -v threshold="$BRANCH_COVERAGE_THRESHOLD" \
            'BEGIN { exit (pct+0 < threshold+0) ? 1 : 0 }'
